services:
  postgresql:
    image: postgres:latest
    container_name: keeplock-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: MyStrong!Passw0rd
      POSTGRES_DB: keeplock
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  
  mongodb:
    image: mongo:7
    container_name: keeplock-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  seq:
    image: datalust/seq:latest
    container_name: keeplock-seq
    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_ADMINPASSWORD: admin@123
    ports:
      - "5341:80"
      - "5342:5341"
    volumes:
      - seq_data:/data
      - seq_logs:/logs
  
  portainer:
    image: portainer/portainer-ce:latest
    container_name: keeplock-portainer
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - portainer_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  postgres_data:
  mongodb_data:
  seq_data:
  seq_logs:
  portainer_data: